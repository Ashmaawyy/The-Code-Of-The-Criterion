[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "furqan-raas"
version = "0.1.0"
description = "Furqan Reasoning-as-a-Skill — MCP-compatible axiom-anchored reasoning server"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
z3 = ["z3-solver>=4.12"]
dev = ["pytest>=7.0"]

[project.scripts]
furqan-raas = "furqan_raas.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
