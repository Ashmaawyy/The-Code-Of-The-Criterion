# Al-Furqan Configuration — Anthropic Claude
llm:
  provider: anthropic
  model_name: claude-3-haiku-20240307
  api_key: ${ANTHROPIC_API_KEY}   # set via environment variable
  temperature: 0.1
  max_tokens: 4096
  top_p: 0.9
  timeout: 120

engine:
  max_correction_passes: 3

store:
  backend: "elasticsearch"         # "file" for legacy JSON-based storage
  verdicts_dir: "/tmp/al-furqan/verdicts"
  chroma_dir: "/tmp/al-furqan/.chroma_db"
  collection_name: criterion_verdicts
  default_retrieval_count: 5
  elasticsearch:
    hosts: ["http://localhost:9200"]
    index_prefix: "furqan"
    request_timeout: 30

review:
  auto_approve_threshold: null
  show_reasoning_detail: true
  max_browse_count: 20

# --- Authentication ----------------------------------------------------------
auth:
  enabled: true
  require_api_key: true
  allow_anonymous_health: true
  key_storage: "~/.al-furqan/api_keys.json"

# --- API Layer ---------------------------------------------------------------
api:
  cors_origins: ["http://localhost:3000"]
  cors_allow_credentials: false
