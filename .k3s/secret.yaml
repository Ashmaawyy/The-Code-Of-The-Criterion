# IMPORTANT: Replace values before applying.
# To encode a value:  echo -n "your-value" | base64
#
# Or use stringData (k8s encodes it automatically):
#   kubectl create secret generic al-furqan-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     -n al-furqan --dry-run=client -o yaml > secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: al-furqan-secrets
  namespace: al-furqan
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-REPLACE_ME"
