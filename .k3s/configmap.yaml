apiVersion: v1
kind: ConfigMap
metadata:
  name: al-furqan-config
  namespace: al-furqan
data:
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  REDIS_URL: "redis://redis:6379/0"
  LLM_PROVIDER: "anthropic"
  LLM_MODEL: "claude-sonnet-4-6"
  CHROMA_PERSIST_DIR: "/app/.chroma_db"
  VERDICTS_DIR: "/app/verdicts"
