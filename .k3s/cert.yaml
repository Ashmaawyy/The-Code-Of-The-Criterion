apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: al-furqan-tls
  namespace: al-furqan
spec:
  secretName: al-furqan-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - al-furqan.dragonteam.dev
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: elasticsearch-tls
  namespace: al-furqan
spec:
  secretName: elasticsearch-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - elasticsearch.dragonteam.dev
