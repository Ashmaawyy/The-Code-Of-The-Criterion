apiVersion: v1
kind: ConfigMap
metadata:
  name: neo4j-proxy-config
  namespace: al-furqan
data:
  nginx.conf: |
    events { }
    http {
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        map $http_upgrade $neo4j_upstream {
            default "http://127.0.0.1:7474";
            "websocket" "http://127.0.0.1:7687";
        }

        server {
            listen 8080;
            location / {
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_pass $neo4j_upstream;
            }
        }
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: al-furqan
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 7474:7474 /data"]
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
      containers:
        - name: neo4j
          image: neo4j:5.18-community
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          env:
            - name: NEO4J_AUTH
              value: "none"
            - name: NEO4J_PLUGINS
              value: '["graph-data-science"]'
            - name: NEO4J_server_memory_heap_max__size
              value: "512m"
            - name: NEO4J_server_memory_pagecache_size
              value: "512m"
            - name: NEO4J_server_config_strict__validation_enabled
              value: "false"
            - name: NEO4J_server_bolt_advertised__address
              value: "neo4j.dragonteam.dev:443"
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
        # Nginx Sidecar Proxy for port 443 consolidation
        - name: neo4j-proxy
          image: nginx:alpine
          ports:
            - containerPort: 8080
              name: proxy
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: neo4j-data
          persistentVolumeClaim:
            claimName: neo4j-data-pvc
        - name: proxy-config
          configMap:
            name: neo4j-proxy-config
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: al-furqan-neo4j-pv
spec:
  storageClassName: ""
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.255.0.96
    path: /NFS_DEV_ENV/al-furqan-neo4j
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data-pvc
  namespace: al-furqan
spec:
  storageClassName: ""
  volumeName: al-furqan-neo4j-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# Headless service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: al-furqan
spec:
  selector:
    app: neo4j
  ports:
    - port: 7474
      targetPort: 7474
      name: http
    - port: 7687
      targetPort: 7687
      name: bolt
  clusterIP: None
---
# ClusterIP service for Ingress (pointing to Proxy)
apiVersion: v1
kind: Service
metadata:
  name: neo4j-http
  namespace: al-furqan
spec:
  selector:
    app: neo4j
  ports:
    - port: 7474
      targetPort: 8080
      name: http
    - port: 7687
      targetPort: 7687
      name: bolt
---
# ClusterIP service for Bolt (legacy/internal)
apiVersion: v1
kind: Service
metadata:
  name: neo4j-bolt
  namespace: al-furqan
spec:
  type: ClusterIP
  selector:
    app: neo4j
  ports:
    - port: 7687
      targetPort: 7687
      name: bolt
